<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>讲述与画面推进 · 17秒对照案例</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#243047;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:28px 22px}h1{font-size:25px;margin:0 0 8px}h2{font-size:17px;margin:0 0 10px}p{margin:8px 0}.status{padding:10px 14px;background:#fff0d7;color:#7b4e14;border-radius:8px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}select,button{font:inherit;border:1px solid #d4d9e3;background:#fff;padding:8px 12px;border-radius:7px}button{cursor:pointer}button:hover{border-color:#6555cf}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{min-width:0}video{display:block;width:100%;background:#182332;border-radius:8px}a{color:#5444b8}.notes{margin-top:18px;color:#566176}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:18px 14px}}
</style></head><body><main>
<h1>讲述推进，画面有没有跟上</h1>
<p class="status">关联反例与迭代材料 · 修正版尚未确认满意，不作为认可样板。</p>
<div class="controls"><label for="version">右侧对照版本</label><select id="version"><option value="diagram-revision.mp4">流程图解迭代</option><option value="scene-revision.mp4">情境画面迭代</option></select><button id="play" type="button">两版从头播放</button><button id="pause" type="button">全部暂停</button></div>
<div class="grid"><section><h2>原片</h2><video id="original" src="original.mp4" controls playsinline preload="none" aria-label="原片"></video></section><section><h2 id="revision-title">流程图解迭代</h2><video id="revision" src="diagram-revision.mp4" controls playsinline preload="none" aria-label="迭代版"></video></section></div>
<p id="focus" class="notes">看三处：一次落选如何与全盘否定分开；准备方式是否实际改变；新经历是否回到同一份简历。</p>
<p class="notes">三版均为17秒、无音轨。情境版为完整插画关键画面切换，人物并非连续动画；项目过程为创作示意。</p>
<p id="error" role="status"></p><a href="case.md">查看案例说明、来源与认可范围</a>
</main><script>
(()=>{'use strict';const original=document.getElementById('original'),revision=document.getElementById('revision'),version=document.getElementById('version'),error=document.getElementById('error');const videos=[original,revision];const notes={'diagram-revision.mp4':'看三处：一次落选如何与全盘否定分开；准备方式是否实际改变；新经历是否回到同一份简历。','scene-revision.mp4':'看承接：收到结果→重新行动→交给人用→发现问题→修复验证→回来继续准备。'};document.getElementById('pause').onclick=()=>videos.forEach(v=>v.pause());version.onchange=()=>{videos.forEach(v=>v.pause());error.textContent='';revision.src=version.value;document.getElementById('revision-title').textContent=version.selectedOptions[0].textContent;document.getElementById('focus').textContent=notes[version.value];};document.getElementById('play').onclick=async()=>{error.textContent='';videos.forEach(v=>{v.pause();v.currentTime=0;v.playbackRate=1});const result=await Promise.allSettled(videos.map(v=>v.play()));if(result.some(r=>r.status==='rejected')){videos.forEach(v=>v.pause());error.textContent='播放未能启动，请用视频控件重试。'}};videos.forEach(v=>v.addEventListener('error',()=>{error.textContent='视频无法加载，请检查案例目录中的 MP4 文件是否完整。'}));})();
</script></body></html>
