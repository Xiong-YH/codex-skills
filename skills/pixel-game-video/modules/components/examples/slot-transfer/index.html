<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凭条落槽与展开</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;color:#e9efd9;background:#101f24;font:16px/1.55 "Microsoft YaHei",sans-serif}
  main{max-width:1000px;margin:auto;padding:20px}
  h1{margin:0 0 12px;font-size:24px}
  canvas{display:block;width:100%;height:auto;background:#14292d}
  .controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:12px}
  button{font:inherit;color:inherit;background:#213a40;border:1px solid #728982;padding:5px 12px;cursor:pointer}
  input{flex:1;min-width:120px;accent-color:#9bd1b7}
</style>
<main>
  <h1>凭条落槽与展开</h1>
  <canvas id="stage" width="960" height="540" aria-label="凭条入槽，像素粒子沿导槽点亮确认按钮，随后凭条展开为回执"></canvas>
  <div class="controls">
    <button id="play" type="button">播放</button>
    <label for="seek">进度</label><input id="seek" type="range" min="0" max="224" step="1" value="0">
    <output id="clock"></output>
  </div>
</main>
<script src="../../../style/runtime.js"></script>
<script src="../../../motion/runtime.js"></script>
<script src="../../../motion/signal-particles.js"></script>
<script src="../../materials.js"></script>
<script src="../../custom/runtime.js"></script>
<script src="../../custom/slot-transfer.js"></script>
<script>
  const canvas = document.getElementById('stage'), g = canvas.getContext('2d');
  const { width, height } = canvas;
  const play = document.getElementById('play'), seek = document.getElementById('seek'), clock = document.getElementById('clock');
  const fps = 60, last = Number(seek.max);
  const events = { launch:38, contact:56, signal:59, armed:80, submit:104, unfold:110, settled:140 };
  const source = { x:164, y:243, width:226, height:64 };
  const slot = { x:560, y:201, width:226, height:64 };
  const result = { x:480, y:128, width:340, height:250 };
  const { rect, plate, paper } = PixelVideo.componentMaterials;
  let frame = 0, running = false, start = 0;

  function line(points,color,weight){
    g.beginPath();
    for(const [index,[x,y]] of points.entries()){
      if(index)g.lineTo(x,y);else g.moveTo(x,y);
    }
    g.strokeStyle=color;g.lineWidth=weight;g.stroke();
  }
  function label(value,x,y,size,color){
    g.font=`600 ${size}px "Microsoft YaHei",sans-serif`;
    g.textAlign='center';g.textBaseline='middle';g.fillStyle=color;g.fillText(value,x,y);
  }
  function render(localFrame){
    const state = PixelSlotTransfer.stateAt({frame:localFrame,events,id:'proof-a',source,slot,result,lift:26});
    const { bounds:b } = state;
    rect(g,0,0,width,height,'#14292d');
    plate(g,{x:113,y:102,width:760,height:336},'#21413f',10,27);
    rect(g,143,168,676,2,'#45625b');
    label('来源',277,139,25,'#c5d9bf');
    label('确认工位',673,139,25,'#c5d9bf');
    plate(g,{x:source.x-4,y:source.y-4,width:source.width+8,height:source.height+8},'#34514f');
    if(state.fold<1){
      g.save();g.globalAlpha=1-state.fold;
      plate(g,{x:slot.x-5,y:slot.y-5,width:slot.width+10,height:slot.height+10},'#0c2027');
      const button={x:slot.x,y:309,width:slot.width,height:56};
      const {x,y}=state.contact;
      const route=[[x+7+state.stopShift,y],[831,y],[831,337],[x,337]];
      line(route,state.ready?'#7ba98a':'#496562',4);
      PixelVideo.signalParticles.draw(g,{points:route,contact:events.contact,release:events.signal,arrival:events.armed,
        size:9,color:'#92dfc9',highlight:'#e4ffeb'},localFrame);
      plate(g,button,state.ready?'#a7d9b1':'#44605f');
      label(state.sent?'已提交':'确认',673,337,26,state.ready?'#152c27':'#c5d4c9');
      g.restore();
    }
    paper(g,b,{face:'#eed4a5',edge:'#a57b54',light:'#fff0cb',fold:Math.min(17,b.height*.25),foldColor:'#d9ad71'});
    label('方案 A',b.x+b.width/2,b.y+b.height*(.50+.15*state.fold),31,'#282c24');
    if(state.fold<1){
      g.save();g.globalAlpha=1-state.fold;
      rect(g,state.contact.x+state.stopShift,slot.y-3,7,slot.height+6,state.selected?'#eed391':'#74938a');
      g.restore();
    }
    if(state.fold>.36){
      g.save();g.globalAlpha=Math.min(1,(state.fold-.36)/.46);
      const x=b.x+b.width*.22,y=b.y+b.height*.31;
      line([[x-9,y],[x-2,y+7],[x+12,y-9]],'#284c3a',5);
      label('已确认',b.x+b.width*.57,y,45,'#284c3a');
      g.restore();
    }
    return state;
  }
  function show(f){
    frame = Math.max(0,Math.min(last,Math.round(f)));
    const state=render(frame);
    seek.value = frame;
    clock.value = (frame/fps).toFixed(2)+' 秒';
    return state;
  }
  function tick(now){
    if(!running)return;
    show((now-start)*fps/1000);
    if(frame<last)requestAnimationFrame(tick);
    else pause();
  }
  function pause(){ running=false;play.textContent='播放'; }
  play.onclick=()=>{
    if(running){pause();return}
    if(frame===last)show(0);
    start=performance.now()-frame*1000/fps;running=true;play.textContent='暂停';
    requestAnimationFrame(tick);
  };
  seek.oninput=()=>{pause();show(Number(seek.value))};
  window.slotTransferDemo={seek:f=>{pause();return show(f)}};
  show(0);
</script>
</html>
