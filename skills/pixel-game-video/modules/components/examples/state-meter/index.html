<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自定义组件 · 状态仪表</title>
<style>
:root{color-scheme:dark;font:15px/1.6 'Microsoft YaHei',sans-serif;color:#eee5d3;background:#101a23}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:24px}h1{font-size:25px;font-weight:500}p{color:#a8b6ba}canvas{width:100%;display:block;background:#14222d;border:1px solid #344650}button,select,input{font:inherit}button,select{padding:9px 14px;background:#233640;color:inherit;border:1px solid #52636a;border-radius:4px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #e5b975;outline-offset:3px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0}label{display:flex;gap:10px;align-items:center}#seek{flex:1;min-width:100px}output{font-variant-numeric:tabular-nums}a{color:#a5d8ca}.scrub{display:flex;gap:12px;align-items:center}#status{min-height:28px;color:#e5b975}@media(max-width:480px){main{padding:12px}h1{font-size:21px}}
</style>
<main><h1>一个组件，完整经历状态变化</h1><p>积累 → 满格 → 警告 → 原条块散落 → 保留结果。独立试样，无声音，数值为示意。</p>
<canvas width="960" height="540" aria-label="人物上方的状态仪表增长后失效，原条块碎裂落地"></canvas>
<div class="controls"><button id="play">播放</button><button id="replay">重播</button><label>布局<select id="layout"><option value="a">居中</option><option value="b">换位置与尺寸</option></select></label><label>条块<select id="count"><option>24</option><option>12</option><option>40</option></select></label></div>
<div class="scrub"><label for="seek">进度</label><input id="seek" type="range" min="0" max="480" value="0" step="1"><output id="clock"></output></div><p id="status" aria-live="polite"></p>
<p><a href="design.md">设计、调用与能力边界</a> · 本例未注册到工作台。</p></main>
<script src="../../custom/runtime.js"></script><script src="../../custom/state-meter.js"></script>
<script>
(()=>{'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),seek=document.querySelector('#seek'),clock=document.querySelector('#clock'),play=document.querySelector('#play'),status=document.querySelector('#status'),layout=document.querySelector('#layout'),count=document.querySelector('#count');
// 仅本例播放器拥有帧表；组件接收事件，不保存另一条时间线。
const events={enter:0,start:0,full:240,risk:300,break:330,settled:360},fps=60;
let frame=0,playing=false,last=0,raf=0,stage='';
function render(){ctx.clearRect(0,0,960,540);const bounds=layout.value==='a'?{x:70,y:20,width:820,height:410}:{x:260,y:100,width:620,height:310};const scale=Math.min(bounds.width/640,bounds.height/320),left=bounds.x+(bounds.width-640*scale)/2,top=bounds.y+(bounds.height-320*scale)/2,ground=top+300*scale,cx=left+320*scale;
ctx.fillStyle='#25343f';for(let i=0;i<18;i++){const h=35+(i*23)%70;ctx.fillRect(i*57,ground-h,45,h);}ctx.strokeStyle='#607078';ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(960,ground);ctx.moveTo(cx,top+166*scale);ctx.lineTo(cx,ground-65);ctx.stroke();
ctx.fillStyle='#d0b991';ctx.fillRect(cx-9,ground-64,18,17);ctx.fillRect(cx-12,ground-46,24,28);ctx.fillRect(cx-9,ground-18,6,18);ctx.fillRect(cx+3,ground-18,6,18);
const state=PixelStateMeter.stateAt({frame,events,params:{count:Number(count.value)}});PixelCustomRuntime.place(ctx,bounds,PixelStateMeter.size,()=>PixelStateMeter.draw(ctx,state));seek.value=frame;clock.textContent=(frame/fps).toFixed(2)+' / 8.00 秒';
if(stage!==state.stage){stage=state.stage;status.textContent={growing:'逐日积累：数字和状态共同增长',full:'满格保持：先看清积累的结果',warning:'风险触发：原条块变红',breaking:'同一批条块脱离仪表，短促落地',settled:'天数保留，状态归零，碎块停在地面'}[stage];}}
function stop(){playing=false;cancelAnimationFrame(raf);play.textContent='播放';}
function tick(now){if(!playing)return;frame=Math.min(480,frame+(now-last)*fps/1000);last=now;const real=frame;frame=Math.floor(frame);render();frame=real;if(frame>=480)stop();else raf=requestAnimationFrame(tick);}
function start(){cancelAnimationFrame(raf);playing=true;last=performance.now();play.textContent='暂停';raf=requestAnimationFrame(tick);}
play.onclick=()=>{if(playing)stop();else{if(frame>=480)frame=0;start();}};
document.querySelector('#replay').onclick=()=>{stop();frame=0;render();start();};seek.oninput=()=>{stop();frame=Number(seek.value);render();};
for(const el of [layout,count])el.onchange=()=>{frame=Math.floor(frame);render();};render();
})();
</script></html>
