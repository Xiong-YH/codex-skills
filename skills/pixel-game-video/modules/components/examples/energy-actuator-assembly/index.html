<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组件融合 · 供能、加工、装配</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101b20;color:#e3e6d5;font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:24px 24px 38px}.eyebrow{font:11px monospace;letter-spacing:3px;color:#9dcab8}h1{font-weight:500;font-size:28px;margin:7px 0}p{margin:0;color:#9eafb0}.stage{border:1px solid #3b5055;margin-top:22px;border-radius:5px;overflow:hidden}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}button{font:inherit;border:1px solid #3b5055;background:#22353c;color:#dce2d4;padding:7px 13px;border-radius:4px;cursor:pointer}button.primary{background:#9ecab7;color:#17332c}button:focus-visible,input:focus-visible{outline:2px solid #e2b97c;outline-offset:3px}label{display:flex;align-items:center;gap:7px;color:#a5b7b3}input{accent-color:#9ecab7}.seek{margin-left:auto}.seek input{width:230px}#clock{font:12px monospace;min-width:84px}.notes{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #34474d;gap:24px;padding-top:18px;margin-top:15px}.notes b{color:#dfbc80;font-weight:500}.notes p{font-size:12px;margin-top:5px}#status{font:12px monospace;color:#aec8b7}.foot{font-size:11px;margin-top:19px}@media(max-width:650px){main{padding:20px 14px}h1{font-size:23px}.notes{grid-template-columns:1fr;gap:12px}.seek{margin-left:0;width:100%}.seek input{flex:1;min-width:80px}}
</style></head><body><main><div class="eyebrow">ENERGY → ACTUATION → ASSEMBLY</div><h1>三个方向，合成一个连续动作。</h1><p>能量接入 → 活塞加工 → 模块移交 → 结构装配。三块模块沿同一条过程推进，最后保留三层结果。</p><div class="stage"><canvas width="960" height="540" data-heading="" data-footer="" aria-label="能量驱动活塞加工，三个模块依次被移交并装配成三层结构"></canvas></div><div class="bar"><button class="primary" id="replay">↻ 重播</button><button id="pause">暂停</button><button id="bg" aria-pressed="true">工坊背景 · 开</button><label><input type="checkbox" id="loop" checked>循环</label><label class="seek">过程 <input type="range" min="0" max="4500" value="0" id="scrub" aria-label="动作进度"><span id="clock"></span></label></div><div id="status"></div><div class="notes"><div><b>能量：成为动作的驱动</b><p>储能管随每次加工充入、释放，能量路线连接到执行机构。</p></div><div><b>机械：靠接触产生反馈</b><p>活塞、夹具与工作台有明确接触。送入 0.30s，加工往返 0.20s，送出 0.30s。</p></div><div><b>结构：留下过程的结果</b><p>同一块模块从来源离开，经过加工后进入装配槽，最终三层保持。</p></div></div><p class="foot">融合方向试样 · 无声音 · 物理装置用于解释过程，不代表软件的实际物理实现。固定预览入口。</p></main><script src="../../fusion-component.js"></script><script>
const $=id=>document.getElementById(id),canvases=[...document.querySelectorAll('canvas')],ctxs=canvases.map(c=>c.getContext('2d')),bg=new Image();bg.src='../../../library/backgrounds/engineering-workshop-v1.png';let time=0,playing=true,last=0,background=true;
const starts=[.38,.99,1.60],dur=.36,clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-x,3),q=x=>Math.round(x),progress=(i,t)=>clamp((t-starts[i])/dur),num=t=>starts.filter(s=>t>=s+.28).length;
const C={edge:'#081319',dark:'#182e35',mid:'#344d52',light:'#688080',brass:'#b98142',gold:'#e7b666',shine:'#ffe0a0',mint:'#9ed8c1',cyan:'#61b9c2'};
function rect(c,x,y,w,h,color){c.fillStyle=color;c.fillRect(q(x),q(y),q(w),q(h))}function poly(c,pts,color){c.fillStyle=color;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(q(p[0]),q(p[1])):c.moveTo(q(p[0]),q(p[1])));c.closePath();c.fill()}
function text(c,s,x,y,size=12,color=C.shine,align='center'){c.fillStyle=color;c.font=`${size}px "Microsoft YaHei",sans-serif`;c.textAlign=align;c.fillText(s,q(x),q(y))}
function metal(c,x,y,w,h){rect(c,x-3,y-3,w+6,h+6,C.edge);rect(c,x,y,w,h,C.brass);rect(c,x+3,y+3,w-6,h-6,C.dark);rect(c,x,y,w,2,C.shine);rect(c,x,y,2,h,C.gold);rect(c,x+3,y+h-5,w-3,5,'#573c2a');for(const [a,b]of[[x+7,y+7],[x+w-9,y+7],[x+7,y+h-9],[x+w-9,y+h-9]]){rect(c,a-2,b-2,5,5,C.edge);rect(c,a,b,2,2,C.gold)}}
function glow(c,x,y,r,col,alpha=.3){c.save();c.globalAlpha=alpha;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore()}
function gear(c,x,y,r,angle){c.save();c.translate(q(x),q(y));c.rotate(angle);for(let i=0;i<12;i++){c.rotate(Math.PI/6);rect(c,-3,-r-4,6,9,C.edge);rect(c,-2,-r-2,4,7,C.brass)}c.fillStyle=C.edge;c.beginPath();c.arc(0,0,r,0,7);c.fill();c.fillStyle=C.brass;c.beginPath();c.arc(0,0,r-3,0,7);c.fill();c.fillStyle=C.dark;c.beginPath();c.arc(0,0,r-7,0,7);c.fill();rect(c,-3,-3,6,6,C.gold);c.restore()}
const digits=['111101101101111','010110010010111','111001111100111','111001111001111'];function digit(c,n,x,y,scale=9,color=C.shine){digits[Math.max(0,Math.min(3,n))].split('').forEach((v,i)=>{if(v==='1')rect(c,x+(i%3)*scale,y+Math.floor(i/3)*scale,scale-1,scale-1,color)})}
function scene(c,t){c.setTransform(2,0,0,2,0,0);c.imageSmoothingEnabled=false;rect(c,0,0,480,270,'#11232c');if(background&&bg.complete&&bg.naturalWidth){c.drawImage(bg,0,0,480,270);rect(c,0,0,480,270,'#09141bc7')}else{const g=c.createLinearGradient(0,0,0,270);g.addColorStop(0,'#152933');g.addColorStop(1,'#0b171e');c.fillStyle=g;c.fillRect(0,0,480,270)}rect(c,44,220,392,2,'#4a64625c');rect(c,44,222,392,7,'#08141d8c');c.fillStyle='#07101699';c.beginPath();c.ellipse(240,219,140,9,0,0,7);c.fill();}

const TOTAL=PixelEnergyAssembly.duration;const stateAt=t=>PixelEnergyAssembly.stateAt(t);const itemPos=a=>PixelEnergyAssembly.itemPos(a);function fusion(c,t){PixelEnergyAssembly.draw(c,{time:t,width:480,height:270})}
function render(){scene(ctxs[0],time);fusion(ctxs[0],time);$('scrub').value=q(time*1000);$('clock').textContent=time.toFixed(2)+' / 4.5s';$('pause').textContent=playing?'暂停':'播放';const states=stateAt(time);$('status').textContent='来源 '+states.filter(a=>a.phase==='source').length+' · 加工/转移 '+states.filter(a=>!['source','installed'].includes(a.phase)).length+' · 已装配 '+states.filter(a=>a.phase==='installed').length;}
let drawn='';function tick(now){if(last&&playing){time+=Math.min(.05,(now-last)/1000);if(time>=TOTAL){if($('loop').checked)time=0;else{time=TOTAL;playing=false}}}last=now;const key=[time,playing,background,bg.complete].join();if(key!==drawn){render();drawn=key}requestAnimationFrame(tick)}
$('replay').onclick=()=>{time=0;playing=true};$('pause').onclick=()=>playing=!playing;$('scrub').oninput=e=>{time=Number(e.target.value)/1000;playing=false};$('bg').onclick=()=>{background=!background;$('bg').setAttribute('aria-pressed',String(background));$('bg').textContent='工坊背景 · '+(background?'开':'关')};window.fusionDemo={seek:t=>{time=Math.max(0,Math.min(TOTAL,t));playing=false;render()},state:()=>({time,playing,ready:bg.complete&&bg.naturalWidth>0,items:stateAt(time)}),itemPos};requestAnimationFrame(tick);
</script></body></html>
