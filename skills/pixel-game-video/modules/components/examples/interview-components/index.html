<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>面试牌桌 · 组件试映</title>
  <style>
    :root{color-scheme:dark;--bg:#101c21;--surface:#19292f;--line:#3b4c4d;--ink:#eee3c9;--muted:#a0ada6;--gold:#dfb778;--mint:#9bbba9}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 "PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
    main{width:min(1240px,100% - 64px);margin:auto;padding:36px 0 48px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}
    .eyebrow{color:var(--gold);font:11px/1.6 ui-monospace,monospace;letter-spacing:2px}h1{font-size:32px;letter-spacing:1px;font-weight:500;line-height:1.3;margin:9px 0 10px}
    p{margin:0;color:var(--muted)}.status-note{font-size:12px;white-space:nowrap;color:var(--muted)}.status-note::before{content:"";display:inline-block;width:6px;height:6px;background:var(--gold);margin-right:8px}
    .tabs{display:flex;border-bottom:1px solid var(--line);gap:5px;overflow:auto}.tab{border:0;border-bottom:2px solid transparent;padding:13px 24px;background:none;color:var(--muted);white-space:nowrap}.tab span{font:11px ui-monospace,monospace;margin-right:10px;color:#71817e}.tab[aria-selected=true]{border-color:var(--gold);color:var(--ink);background:#ffffff04}.tab[aria-selected=true] span{color:var(--gold)}
    .study-heading{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:22px 0 14px}h2{font-size:20px;font-weight:500;margin:0 0 4px}.study-heading p{font-size:13px}.scene-switches{display:flex;gap:8px;flex-shrink:0}
    .small-button,select{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:2px;font-size:12px}.small-button[aria-pressed=true]{color:var(--gold);border-color:#8a7253}
    .stage{position:relative;overflow:hidden;border:1px solid #52605b;background:#152329;box-shadow:0 20px 55px #0003}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}.phase{position:absolute;left:20px;top:16px;pointer-events:none;color:#d8d9c8;font-size:12px;padding:4px 9px;background:#101c21d9;border-left:2px solid var(--gold)}
    .transport{display:flex;align-items:center;gap:9px;margin:16px 0 10px}.primary,.secondary{border:1px solid var(--line);padding:8px 16px;border-radius:2px}.primary{background:var(--gold);color:#202c2d;border-color:var(--gold);min-width:80px}.secondary{background:var(--surface);color:var(--ink)}
    .timeline{flex:1;min-width:80px;accent-color:var(--gold);margin:0 10px}.clock{font:12px ui-monospace,monospace;color:var(--muted);min-width:91px}.speed{padding:7px 8px}.loop{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap}.loop input{accent-color:var(--gold)}
    .beats{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 24px}.beat{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 11px;font-size:12px;border-radius:2px}.beat:hover{color:var(--ink);border-color:#9b825c}
    .notes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;padding:21px 0;border-top:1px solid var(--line)}.notes h3{font-size:13px;font-weight:500;color:var(--gold);margin:0 0 6px}.notes p{font-size:13px}
    .trial{padding:20px;border:1px solid var(--line);background:var(--surface);margin:0 0 22px}.trial[hidden]{display:none}.trial h3{font-size:15px;font-weight:500;margin:0 0 5px}.trial>p{font-size:12px}.trial form{display:flex;gap:10px;margin-top:15px;align-items:center;flex-wrap:wrap}.trial input{background:#112026;color:var(--ink);border:1px solid #536360;padding:8px 10px;width:210px;max-width:100%}.trial label{color:var(--muted);font-size:12px}.trial .result{margin-top:12px;color:var(--gold);min-height:22px;font-size:13px}
    details{border-top:1px solid var(--line);padding:16px 0;color:var(--muted)}summary{cursor:pointer;font-size:12px}.contract{display:grid;grid-template-columns:65px 1fr;gap:8px 16px;font-size:12px;margin-top:18px}.contract dt{color:var(--gold)}.contract dd{margin:0}.contract code{font-size:11px;word-break:break-word}
    footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:17px;margin-top:8px;color:#83958e;font-size:11px}a{color:var(--mint);text-decoration:none}a:hover{text-decoration:underline}
    @media(max-width:750px){main{width:calc(100% - 28px);padding-top:24px}header{display:block}.status-note{margin-top:12px}h1{font-size:26px}.tab{padding:11px 13px}.tab span{margin-right:5px}.study-heading{display:block}.scene-switches{margin-top:12px}.notes{grid-template-columns:1fr;gap:14px}.transport{flex-wrap:wrap}.timeline{order:2;flex-basis:65%;margin-left:0}.clock{order:3}.loop{margin-left:auto}.phase{top:8px;left:8px;font-size:10px;padding:2px 6px}footer{display:block}footer a{display:inline-block;margin-top:8px}.trial{padding:14px}.trial form{gap:8px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">INTERVIEW / OBJECT STUDIES</div><h1>面试牌桌 · 组件试映</h1><p>翻开经历，停下判决，再把任务试一次。</p></div>
    <div class="status-note">独立试样 · 无声音</div>
  </header>
  <nav class="tabs" aria-label="切换组件">
    <button class="tab" data-study="cards" aria-selected="true"><span>01</span>实体对照牌</button>
    <button class="tab" data-study="stamp" aria-selected="false"><span>02</span>悬停判决印章</button>
    <button class="tab" data-study="task" aria-selected="false"><span>03</span>任务试做台</button>
  </nav>
  <section aria-labelledby="study-title">
    <div class="study-heading"><div><h2 id="study-title"></h2><p id="study-description"></p></div><div class="scene-switches"><button class="small-button" id="layout" aria-pressed="false">换个摆放位置</button><button class="small-button" id="background" aria-pressed="true">桌面背景 · 开</button></div></div>
    <div class="stage"><canvas id="canvas" width="1920" height="1080" role="img" aria-label="自定义组件动态试样"></canvas><div class="phase" id="phase" aria-live="off"></div></div>
    <div class="transport">
      <button class="primary" id="play">暂停</button><button class="secondary" id="replay">重播</button>
      <input class="timeline" id="seek" type="range" min="0" max="8400" step="1" value="0" aria-label="拖动查看动作过程">
      <span class="clock" id="clock"></span>
      <select class="speed" id="speed" aria-label="播放速度"><option value="0.5">0.5 倍</option><option value="1" selected>正常速度</option></select>
      <label class="loop"><input type="checkbox" id="loop">循环</label>
    </div>
    <div class="beats" id="beats" aria-label="跳到关键动作"></div>
    <div class="trial" id="trial" hidden>
      <h3>自己再试一次这张报名表</h3><p>从未修复的状态另试一次。先空着提交，画面会跟随你的操作；再补校验、回原表单重试。</p>
      <form id="trial-form" novalidate><label for="trial-name">姓名</label><input id="trial-name" autocomplete="off" placeholder="先留空试试"><button class="secondary" type="submit">提交报名</button><button class="small-button" id="trial-fix" type="button">补上必填校验</button><button class="small-button" id="trial-reset" type="button">重新试做</button></form>
      <p class="result" id="trial-result" role="status">你的试做尚未开始：先留空提交。</p>
    </div>
    <div class="notes"><div><h3>这次解释什么</h3><p id="meaning"></p></div><div><h3>动作怎么完成</h3><p id="motion"></p></div><div><h3>结果留下什么</h3><p id="result"></p></div></div>
    <details><summary>五维约定与当前能力范围</summary><dl class="contract" id="contract"></dl></details>
  </section>
  <footer><span>可播放、暂停或拖动检查中间态。当前是组件试样，尚未接入工作台与正式成片。</span><a href="../resource-into-tray/index.html">已有的筹码入托盘试样 →</a></footer>
</main>
<script src="../../interview/drawing.js"></script>
<script src="../../interview/cards.js"></script>
<script src="../../interview/stamp.js"></script>
<script src="../../interview/task-station.js"></script>
<script src="preview.js"></script>
</body>
</html>
