<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R41 组件库</title>
<style>
:root { color-scheme:light; --ink:#263d35; --soft:#596b60; --pine:#28423a; --paper:#f6f1e4; --line:#d9d1bd; --gold:#a17136; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:#eee8d9; font:15px/1.58 'Instrument Sans','Microsoft YaHei','Noto Sans CJK SC',sans-serif; }
main { width:min(1480px,100%); margin:auto; padding:32px clamp(18px,4vw,58px) 55px; }
header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; border-bottom:1px solid var(--line); padding-bottom:22px; }
h1,h2,p { margin:0; }
h1 { font-size:clamp(30px,4vw,49px); letter-spacing:-.04em; line-height:1.08; }
h2 { font-size:25px; line-height:1.18; letter-spacing:-.02em; }
.count,.muted { color:var(--soft); }
nav { display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 14px; }
button { font:inherit; color:inherit; border:1px solid #c9c3ae; background:#faf7ed; padding:7px 13px; border-radius:5px; cursor:pointer; }
button:hover { border-color:#799182; }
button:focus-visible,input:focus-visible,summary:focus-visible { outline:2px solid #3b7365; outline-offset:3px; }
button:disabled { cursor:default; opacity:.48; }
button[aria-pressed="true"], .primary { background:var(--pine); color:#fff1d2; border-color:var(--pine); }
.selected { display:grid; grid-template-columns:minmax(0,2.2fr) minmax(273px,1fr); gap:16px; }
.preview,.detail { background:var(--paper); border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.screen { position:relative; background:#233b38; }
.screen canvas { width:100%; height:auto; display:block; aspect-ratio:16/9; }
.transport { display:flex; align-items:center; flex-wrap:wrap; gap:7px; padding:9px 11px 11px; }
.transport button { font-size:13px; padding:6px 9px; }
.transport input { display:block; flex:1; min-width:95px; accent-color:#477263; }
output { color:var(--soft); font:12px/1.2 'IBM Plex Mono',Consolas,monospace; white-space:nowrap; }
.detail { padding:20px; display:flex; flex-direction:column; gap:15px; align-self:stretch; }
.detail p { font-size:14px; }
.moments { display:grid; gap:5px; }
.moments button { display:flex; align-items:center; justify-content:space-between; gap:7px; text-align:left; background:#fbf7ec; padding:7px 9px; font-size:13px; }
.moments button span { font:11px 'IBM Plex Mono',Consolas,monospace; color:#687d71; }
.utility { display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; }
.utility button { font-size:13px; padding:6px 8px; }
.grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:13px; margin-top:18px; }
.card { display:block; text-align:left; overflow:hidden; border:1px solid var(--line); background:var(--paper); border-radius:6px; padding:0; }
.card[aria-pressed="true"] { background:var(--pine); color:#f9e9c5; border-color:#385e4e; }
.card canvas { display:block; width:100%; height:auto; aspect-ratio:16/9; background:#344b43; }
.card strong { display:block; padding:9px 10px 10px; font-size:14px; }
dialog { width:min(990px,92vw); padding:0; border:1px solid #88998b; border-radius:8px; background:var(--paper); color:var(--ink); }
dialog::backdrop { background:#182b26dc; }
dialog header { padding:11px 14px; align-items:center; }
dialog img { display:block; width:100%; }
dialog textarea { width:100%; min-height:min(51vh,565px); resize:vertical; padding:15px; background:#faf7ee; color:var(--ink); border:0; font:13px/1.55 'IBM Plex Mono',Consolas,monospace; }
#error { color:#983f30; padding:14px; }
[hidden] { display:none !important; }
@media (max-width:950px) {
  .grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .selected { grid-template-columns:minmax(0,1.75fr) minmax(240px,1fr); }
}
@media (max-width:720px) {
  header { align-items:flex-start; flex-direction:column; gap:7px; }
  .selected { grid-template-columns:1fr; }
  .detail { padding:16px; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; } }
</style>
</head>
<body>
<main>
  <header><h1>R41 组件库</h1><span id="count" class="count"></span></header>
  <nav id="filters" aria-label="组件类别"></nav>
  <section class="selected" aria-labelledby="title">
    <div class="preview">
      <div class="screen"><canvas id="preview" width="1280" height="720" aria-label="当前组件预览"></canvas></div>
      <div class="transport">
        <button class="primary" type="button" id="play" disabled>从头播放</button>
        <button type="button" id="pause" disabled>暂停</button>
        <button type="button" id="back" disabled aria-label="上一帧">‹</button>
        <button type="button" id="next" disabled aria-label="下一帧">›</button>
        <input id="seek" type="range" step="1" min="0" value="0" aria-label="组件预览进度" disabled>
        <output id="clock">载入中</output>
      </div>
      <p id="error" role="alert" hidden></p>
    </div>
    <aside class="detail">
      <h2 id="title"></h2>
      <p class="muted" id="description"></p>
      <div class="moments" id="moments" aria-label="动作节点"></div>
      <div class="utility">
        <button type="button" id="reference" hidden>看 R41 原帧</button>
        <button type="button" id="example" disabled>查看样例 JSON</button>
      </div>
    </aside>
  </section>
  <div class="grid" id="clips" aria-label="组件预览列表"></div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title">
  <header><strong id="dialog-title"></strong><button type="button" id="close">关闭</button></header>
  <img id="still" alt="" hidden>
  <textarea id="json" aria-label="可复制的镜头 JSON" readonly hidden></textarea>
</dialog>
<script>__RUNTIME__</script>
<script id="package" type="application/json">__PACKAGE__</script>
<script>
'use strict';
const {gallery,payload}=JSON.parse(document.querySelector('#package').textContent);
const get=id=>document.getElementById(id);
const byId=new Map(gallery.clips.map(clip=>[clip.id,clip]));
const fps=payload.resolved.project.fps;
const wall=(n,tag='button')=>{
  const el=document.createElement(tag);
  if(tag==='button')el.type='button';
  if(n)el.textContent=n;
  return el;
};
const newCanvas=(width,height)=>{
  const c=document.createElement('canvas');
  c.width=width;
  c.height=height;
  return c;
};
const cards=new Map();
let selected=byId.get(gallery.initial), frame=selected.poster, group='all';
let player, playing=false, raf=0, startTime=0, startFrame=0;

function draw(value){
  frame=Math.max(0,Math.min(selected.frames-1,Math.floor(value)));
  player.draw((selected.start+frame)/fps);
  get('seek').value=frame;
  get('clock').textContent=`${(frame/fps).toFixed(2)} / ${(selected.frames/fps).toFixed(2)} 秒`;
}

function halt(){
  cancelAnimationFrame(raf);
  playing=false;
  get('pause').disabled=frame===selected.frames-1;
  get('pause').textContent='继续';
}

function seek(value){
  halt();
  draw(value);
  get('pause').disabled=frame===selected.frames-1;
}

function tick(timestamp){
  if(!playing)return;
  if(!startTime)startTime=timestamp;
  draw(startFrame+(timestamp-startTime)*fps/1000);
  if(frame===selected.frames-1){halt();return;}
  raf=requestAnimationFrame(tick);
}

function play(from){
  halt();
  draw(from);
  startFrame=frame;
  startTime=0;
  playing=true;
  get('pause').disabled=false;
  get('pause').textContent='暂停';
  raf=requestAnimationFrame(tick);
}

function select(id){
  const clip=byId.get(id);
  if(!clip)return;
  selected=clip;
  get('title').textContent=clip.title;
  get('description').textContent=clip.description;
  get('seek').max=clip.frames-1;
  get('reference').hidden=!clip.reference?.image;
  get('moments').replaceChildren(...clip.markers.map(mark=>{
    const button=wall(mark.label), time=wall(`${(mark.frame/fps).toFixed(2)} s`,'span');
    button.append(time);
    button.onclick=()=>seek(mark.frame);
    return button;
  }));
  for(const [key,card] of cards)card.setAttribute('aria-pressed',String(key===id));
  seek(clip.poster);
}

function filter(id){
  group=id;
  for(const button of get('filters').children)button.setAttribute('aria-pressed',String(button.dataset.group===group));
  for(const clip of gallery.clips)cards.get(clip.id).hidden=id!=='all'&&clip.category!==id;
}

function dialog(mode){
  const reference=mode==='reference';
  get('still').hidden=!reference;
  get('json').hidden=reference;
  if(reference){
    const ref=selected.reference;
    get('dialog-title').textContent=`R41 · ${ref.label} · ${ref.frame} 帧`;
    get('still').alt=ref.label;
    get('still').src=ref.image;
  }else{
    get('dialog-title').textContent=selected.title+' · timeline.json';
    get('json').value=JSON.stringify(selected.example,null,2);
  }
  get('dialog').showModal();
}

async function open(){
  await document.fonts.ready;
  const assets={};
  await Promise.all(Object.entries(payload.assets).map(async([id,src])=>{
    const image=new Image();
    image.src=src;
    await image.decode();
    assets[id]=image;
  }));
  const back=newCanvas(1280,720);
  PixelVideo.componentLook.desk(back.getContext('2d'));
  assets.galleryDesk=back;
  const resolved={...payload.resolved,project:{...payload.resolved.project,width:1280,height:720}};
  resolved.shots=resolved.shots.map(shot=>({ ...shot,background:{assetKey:'galleryDesk',kind:'image',fit:'cover',anchorX:.5,anchorY:.5,dim:0} }));
  const use=canvas=>PixelVideo.createRenderer({canvas,createCanvas:newCanvas,assets,resolved,mouth:payload.mouth,style:payload.style});
  player=use(get('preview'));
  const sheet=newCanvas(1280,720), render=use(sheet);
  for(const clip of gallery.clips){
    const button=wall(''), canvas=newCanvas(360,203);
    canvas.setAttribute('aria-hidden','true');
    render.draw((clip.start+clip.poster)/fps);
    canvas.getContext('2d').drawImage(sheet,0,0,canvas.width,canvas.height);
    button.className='card';
    button.dataset.clip=clip.id;
    button.append(canvas,wall(clip.title,'strong'));
    button.onclick=()=>{
      select(clip.id);
      get('title').scrollIntoView({block:'nearest'});
    };
    cards.set(clip.id,button);
    get('clips').append(button);
  }
  for(const [id,name] of [['all','全部'],...Object.entries(gallery.categories)]){
    const button=wall(name);
    button.dataset.group=id;
    button.onclick=()=>filter(id);
    get('filters').append(button);
  }
  get('count').textContent=`${new Set(gallery.clips.map(c=>c.kind)).size} 类组件 · ${gallery.clips.length} 段预览`;
  for(const id of ['play','pause','back','next','seek','example'])get(id).disabled=false;
  select(gallery.initial);
  filter('all');
  window.componentGallery={select,seek,frame:()=>frame,ready:true};
}

get('play').onclick=()=>play(0);
get('pause').onclick=()=>playing?halt():play(frame);
get('back').onclick=()=>seek(frame-1);
get('next').onclick=()=>seek(frame+1);
get('seek').oninput=()=>seek(Number(get('seek').value));
get('reference').onclick=()=>dialog('reference');
get('example').onclick=()=>dialog('example');
get('close').onclick=()=>get('dialog').close();
open().catch(error=>{
  get('error').textContent='图册载入失败 '+error.message;
  get('error').hidden=false;
  console.error(error);
});
</script>
</body>
</html>
