if(item.preview)get('preview').src=item.preview.path+'?effect='+encodeURIComponent(item.preview.effect)+'&embed=1';else get('preview').removeAttribute('src');

function filter(){const list=data.entries.filter(x=>x.intent===get('intent').value&&x.status!=='retired'&&(x.exposure==='primary'||get('legacy').checked)&&((x.status==='ready'&&x.backends.includes(get('backend').value))||(get('designs').checked&&x.status==='approved-design')));get('choices').replaceChildren();get('empty').hidden=!!list.length;
if(!list.length){get('name').textContent='暂无选择';get('status').textContent='';get('purpose').textContent='';get('boundary').textContent='';get('preview').hidden=true;get('preview').removeAttribute('src');get('no-preview').hidden=true;get('details').textContent='';get('docs').hidden=true;get('source').hidden=true;return;}
get('docs').hidden=false;for(const item of list){const b=document.createElement('button');b.type='button';b.dataset.id=item.id;b.textContent=item.title;const small=document.createElement('small');small.textContent=labels[item.status];b.appendChild(small);b.onclick=()=>show(item);get('choices').appendChild(b);}show(list.find(x=>x.id===selected)||list[0]);}
for(const id of ['intent','backend','designs','legacy'])get(id).onchange=filter;filter();
window.motionSelection={data,filter};
</script></body></html>
