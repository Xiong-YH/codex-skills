<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导演运镜选型</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f0e8;color:#243d34;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1200px;margin:auto;padding:26px 20px}h1{margin:0;font-size:28px}p{margin:6px 0 18px;color:#5f7368}.filters{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}label{display:flex;align-items:center;gap:7px}select,button{font:inherit;color:inherit;background:#e6e9df;border:1px solid #b4c4b6;border-radius:4px;padding:8px;cursor:pointer}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px}#choices{display:flex;flex-direction:column;gap:8px}#choices button{text-align:left}button[aria-pressed=true]{background:#254d3c;color:#f6f4e9}#choices small{display:block;font-size:12px}iframe{width:100%;height:620px;border:1px solid #b4c4b6;background:#e4ebdf}h2{margin:0 0 5px;font-size:23px}#status{display:inline-block;padding:3px 8px;background:#dde9d9;font-size:13px}#purpose{margin-top:10px}#details{white-space:pre-wrap;font:13px/1.6 ui-monospace,Consolas,monospace;overflow-wrap:anywhere;background:#e7e9e0;padding:14px}#empty{color:#675d48}a{color:#176d52}.links{display:flex;gap:18px;margin:12px 0}#no-preview{padding:25px 0;color:#6b725f}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #268362;outline-offset:2px}@media(max-width:740px){.layout{grid-template-columns:1fr}#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:20px 12px}iframe{height:430px}}@media(pointer:coarse){button,select{min-height:44px}}</style></head><body><main>
<h1>这一个镜头，想让观众怎样看？</h1><p>先选解释目的，再看效果与实现状态。默认只显示当前后端可调用的常用选择。</p>
<div class="filters"><label>目的<select id="intent"></select></label><label>后端<select id="backend"><option value="canvas">Canvas / 工作台桥接</option><option value="remotion">原生 Remotion</option></select></label><label><input id="designs" type="checkbox">查看已认可待接入设计</label><label><input id="legacy" type="checkbox">查看旧／特定用途配方</label></div>
<div class="layout"><nav id="choices" aria-label="可选效果"></nav><section><h2 id="name"></h2><span id="status"></span><p id="purpose"></p><p id="boundary"></p><iframe id="preview" title="所选效果的动态预览"></iframe><div id="no-preview" hidden>此项尚无单项同源HTML预览。请按调用说明准备项目试样，不以其他动效代替。</div><div class="links"><a id="docs">调用与边界</a><a id="source">实现源</a></div><pre id="details"></pre><p id="empty" hidden>当前条件没有可用选项；可调整解释目的或查看待接入设计。不要把其他后端能力当成已支持。</p></section></div>
<p>目录由 selection.json 与实际 catalog、后端白名单共同生成。design.motion.* 是选型标识，不能填入工程 recipe；具体数值仍按当前事件和曲线规范确定。</p>
</main><script>
const data=__MOTION_DATA__;
const get=id=>document.getElementById(id),labels={ready:'可调用 · 仍需本片验收','approved-design':'设计已认可 · 正式适配待完成'};
for(const [id,title]of Object.entries(data.intents)){const option=document.createElement('option');option.value=id;option.textContent=title;get('intent').appendChild(option);}
let selected;
function show(item){selected=item.id;for(const b of get('choices').children)b.setAttribute('aria-pressed',String(b.dataset.id===item.id));get('name').textContent=item.title;get('status').textContent=labels[item.status];get('purpose').textContent=item.purpose;get('boundary').textContent=item.avoid;get('docs').href=item.documentation;get('source').hidden=!item.implementation;if(item.implementation)get('source').href=item.implementation;
get('preview').hidden=!item.preview;get('no-preview').hidden=!!item.preview;
if(item.preview)get('preview').src=item.preview.path+'?effect='+encodeURIComponent(item.preview.effect)+'&embed=1';else get('preview').removeAttribute('src');
get('details').textContent=item.binding?JSON.stringify({selectionId:item.id,binding:item.binding,parameters:item.parameters,backends:item.backends},null,2):item.status==='approved-design'?'此项仅用于设计讨论，暂无可复制的正式配方。':'固定镜头：无需添加相机 motion。';}
function filter(){const list=data.entries.filter(x=>x.intent===get('intent').value&&x.status!=='retired'&&(x.exposure==='primary'||get('legacy').checked)&&((x.status==='ready'&&x.backends.includes(get('backend').value))||(get('designs').checked&&x.status==='approved-design')));get('choices').replaceChildren();get('empty').hidden=!!list.length;
if(!list.length){get('name').textContent='暂无选择';get('status').textContent='';get('purpose').textContent='';get('boundary').textContent='';get('preview').hidden=true;get('preview').removeAttribute('src');get('no-preview').hidden=true;get('details').textContent='';get('docs').hidden=true;get('source').hidden=true;return;}
get('docs').hidden=false;for(const item of list){const b=document.createElement('button');b.type='button';b.dataset.id=item.id;b.textContent=item.title;const small=document.createElement('small');small.textContent=labels[item.status];b.appendChild(small);b.onclick=()=>show(item);get('choices').appendChild(b);}show(list.find(x=>x.id===selected)||list[0]);}
for(const id of ['intent','backend','designs','legacy'])get(id).onchange=filter;filter();
window.motionSelection={data,filter};
</script></body></html>
