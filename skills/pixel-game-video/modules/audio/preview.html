<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>街机音效 · 动作选型库</title>
<style>
*{box-sizing:border-box}body{background:#101722;color:#e6edf8;font:16px/1.55 system-ui;margin:40px auto;max-width:1140px;padding:0 22px}h1{font-size:34px;color:#b5efcb;margin-bottom:6px}header p{max-width:820px;color:#b5c4d7}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;margin-top:24px}article,section{background:#1b2738;padding:24px;border:1px solid #334458;border-radius:12px}section{margin:24px 0}.badge{font-size:12px;color:#b7dfbd;letter-spacing:.03em}h2{font-size:21px;margin:8px 0}code{font-size:12px;color:#90abc8}p,summary{color:#aebed1}audio{width:100%;margin:10px 0 12px;height:40px}label{display:block}summary{cursor:pointer;margin:12px 0}.use{color:#c5ddcf;font-size:14px}.avoid{font-size:13px;color:#a5b2c5}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:8px 15px;border:1px solid #485971;border-radius:7px;background:#1d2c40;color:#dce8f6;cursor:pointer}button[aria-pressed="true"]{background:#b5efcb;color:#10231a;border-color:#b5efcb}[hidden]{display:none!important}footer{margin:30px 0;color:#9bacc1;font-size:13px}
</style>
<header><h1>游戏音效 · __COUNT__ 种</h1><p>__INTRO__</p></header>
<nav aria-label="筛选音效"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="arcade-core" aria-pressed="false">基础六种</button></nav>
<main>__CARDS__</main>
<footer>AI 选型：先看实际动作及状态变化，再选声音、力度和触点。可选不等于每个动作都必须配音。技术检查与主观听感分别记录。</footer>
<script>
document.querySelectorAll('audio').forEach(audio=>audio.addEventListener('play',()=>document.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause()})));
document.querySelectorAll('button[data-filter]').forEach(button=>button.addEventListener('click',()=>{
  const filter=button.dataset.filter;
  document.querySelectorAll('button[data-filter]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
  document.querySelectorAll('article').forEach(card=>{card.hidden=filter!=='all'&&card.dataset.bank!==filter&&card.dataset.group!==filter});
}));
</script>
</html>
