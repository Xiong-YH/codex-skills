<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>柔边字幕视觉试样</title><style>body{margin:24px;background:#111820;color:#eee;font:16px system-ui}main{max-width:1280px;margin:auto}canvas{width:100%;height:auto}label{display:inline-block;margin:8px}input{width:300px;padding:8px}select{padding:8px}p{color:#b9cad3}</style><main><h1>柔边底板 · 暖金重音</h1><p>静态设计参考，非生产执行器。文案与关键词可编辑；本试样仅支持单行，超宽时提示修改。</p><label>背景 <select id="background"><option value="warm">暖色</option><option value="dark">暗色</option></select></label><label>文案 <input id="text" value="先保存一个版本，再继续修改。"></label><label>重点词 <input id="keyword" value="保存一个版本"></label><p id="status" role="status"></p><canvas id="preview" width="1280" height="720"></canvas></main><script>
const canvas=document.getElementById('preview'),g=canvas.getContext('2d'),text=document.getElementById('text'),keyword=document.getElementById('keyword'),background=document.getElementById('background'),status=document.getElementById('status');
const images={};let generation=0;
async function draw(){const version=++generation,key=background.value;if(!images[key]){const im=new Image();im.src=key==='warm'?'../../../style/references/chunky/scene.png':'../../../library/backgrounds/pixel-server-room.png';try{await im.decode();images[key]=im;}catch(e){status.textContent='背景加载失败，请保持 skill 内相对目录。';return;}}if(version!==generation)return;g.clearRect(0,0,1280,720);g.drawImage(images[key],0,0,1280,720);g.font='700 34px "Microsoft YaHei",sans-serif';g.textBaseline='middle';const value=text.value,term=keyword.value,runs=[];let pos=0;while(pos<value.length){const at=term?value.indexOf(term,pos):-1;if(at<0){runs.push([value.slice(pos),false]);break;}if(at>pos)runs.push([value.slice(pos,at),false]);runs.push([term,true]);pos=at+term.length;}const width=runs.reduce((s,r)=>s+g.measureText(r[0]).width,0);if(width>1280*.84||value.includes('\n')){status.textContent='文案超出单行区域，请拆句；本试样不缩小字号。';return;}status.textContent=term&&!value.includes(term)?'文案未匹配重点词，显示普通字幕。':'';const y=720*.87,left=(1280-width)/2-104,right=(1280+width)/2+104,fade=104/(right-left),gradient=g.createLinearGradient(left,0,right,0);gradient.addColorStop(0,'rgba(8,15,24,0)');gradient.addColorStop(fade,'rgba(8,15,24,.65)');gradient.addColorStop(1-fade,'rgba(8,15,24,.65)');gradient.addColorStop(1,'rgba(8,15,24,0)');g.fillStyle=gradient;g.fillRect(left,y-42,right-left,84);let x=(1280-width)/2;for(const [word,accent]of runs){const rw=g.measureText(word).width;g.shadowColor='rgba(0,0,0,.7)';g.shadowBlur=3;g.shadowOffsetY=2;g.fillStyle=accent?'#f7cf82':'#f5f3ec';g.fillText(word,x,y);g.shadowBlur=0;g.shadowOffsetY=0;if(accent){g.fillStyle='#f7cf82';g.fillRect(x,y+25,rw,3);}x+=rw;}}
for(const input of [text,keyword,background])input.addEventListener('input',draw);draw();
</script></html>
