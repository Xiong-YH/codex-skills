<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>提问的艺术 R38 · 导演参考</title>
<style>
  :root{color-scheme:dark;--page:#16241f;--panel:#263930;--edge:#476053;--text:#f6e7c8;--soft:#bbcab9;--accent:#dce8c1;--gold:#e8bb80}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);font:15px/1.55 Inter,"Microsoft YaHei","PingFang SC",sans-serif}
  main{width:min(1320px,calc(100% - 44px));margin:auto;padding:26px 0}
  h1,h2,p,figure{margin:0}
  h1{font-size:clamp(27px,4vw,43px);letter-spacing:.01em;line-height:1.2}
  h2{font-size:19px}
  header{display:flex;align-items:last baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  header p,small,output{color:var(--soft)}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,350px);gap:18px;align-items:start}
  figure,.clips,.steps{border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--panel)}
  .sidebar{display:grid;gap:12px}
  .screen{position:relative}
  canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#263a33}
  .marks{position:absolute;inset:0;pointer-events:none}
  .mark{position:absolute;border:2px solid #fec679;border-radius:3px;box-shadow:0 0 0 1px #26342b}
  .mark span{position:absolute;left:-2px;bottom:100%;padding:1px 5px;white-space:nowrap;background:#253f36;color:#ffe5ad;font-size:clamp(9px,1.1vw,13px)}
  figcaption,.clips,.steps{padding:14px}
  #seek{width:100%;accent-color:var(--accent);margin:6px 0 14px}
  .controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .controls output{margin-left:auto;font:13px/1.5 "IBM Plex Mono",Consolas,monospace}
  button{border:1px solid var(--edge);border-radius:6px;padding:6px 10px;cursor:pointer;background:#2f493b;color:var(--text);font:inherit}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  #play{background:var(--accent);color:#23342b;font-weight:740;min-width:70px}
  #clip-list{display:grid;gap:7px;margin-top:10px}
  #clip-list button{text-align:left}
  #clip-list button[aria-current="true"]{background:#43523b;border-color:var(--gold);color:#ffe4b0}
  #clip-list small{display:block;font-size:12px}
  #watch{margin:11px 0;color:var(--soft)}
  .steps-title{margin:0 0 8px;color:var(--accent);font-size:15px}
  .moments{display:grid;gap:8px}
  .moment{text-align:left;align-content:start;padding:10px 11px;background:#2a4237}
  .moment[aria-current="step"]{border-color:var(--gold);background:#354a3a}
  .moment-time,.moment-title,.moment-detail{display:block}
  .moment-time{color:#ebcb94;font:12px/1.45 "IBM Plex Mono",Consolas,monospace}
  .moment-title{font-weight:750;margin:2px 0}
  .moment-detail{color:var(--soft);font-size:13px}
  #error{color:#ffcf9c;margin-top:8px}
  input[type="checkbox"]{accent-color:var(--accent)}
  @media(min-width:721px) and (min-height:640px){figure{position:sticky;top:18px}}
  @media(max-width:720px){main{width:calc(100% - 22px);padding-top:16px}.layout{grid-template-columns:1fr}.controls output{margin-left:0}}
</style>
</head>
<body>
<main>
  <header><h1>《提问的艺术》导演参考</h1><p>R38 · 《步进》V5 街机版 · 01:28</p></header>
  <div class="layout">
    <figure>
      <div class="screen">
        <canvas id="film" width="1280" height="720" aria-label="R38 Canvas 画面"></canvas>
        <div id="marks" class="marks" aria-hidden="true"></div>
      </div>
      <figcaption>
        <div class="controls">
          <button id="play" type="button" disabled>播放</button>
          <button id="back" type="button" disabled>上一帧</button>
          <button id="next" type="button" disabled>下一帧</button>
          <label><input id="sound" type="checkbox" checked> 原混音</label>
          <output id="clock" for="seek">载入中</output>
        </div>
        <input id="seek" type="range" min="0" value="0" step="1" aria-label="原片进度" disabled>
        <h2 id="clip-title"></h2>
        <p id="watch"></p>
        <p id="error" role="status" hidden></p>
      </figcaption>
    </figure>
    <aside class="sidebar">
      <section class="clips" aria-labelledby="clips-heading">
        <h2 id="clips-heading">整片与选段</h2>
        <nav id="clip-list" aria-label="选择整片或动态片段"></nav>
      </section>
      <section class="steps" aria-labelledby="steps-title">
        <h2 class="steps-title" id="steps-title">镜头变化</h2>
        <div class="moments" id="moments"></div>
      </section>
    </aside>
  </div>
  <audio id="audio" src="mix.m4a" preload="metadata"></audio>
</main>
<script src="clips.js"></script>
<script src="picture.js"></script>
<script>
(() => {
  'use strict';

  const { fps, frames } = window.ASKING_RECUT;
  const cut = window.AskingRecut;
  const byId = id => document.getElementById(id);
  const audio = byId('audio'), seek = byId('seek'), play = byId('play');
  const list = byId('clip-list'), moments = byId('moments'), errorBox = byId('error');
  const canvas = byId('film'), marks = byId('marks');
  const full = { ...window.ASKING_MOTION_FULL, from: 0, to: frames };
  const clips = [full, ...window.ASKING_MOTION_CLIPS];
  let clip, frame, currentMoment = -2, running = false, generation = 0, animation = 0;
  const clock = frame => {
    const centi = Math.floor(frame * 100 / fps);
    const two = value => String(value).padStart(2, '0');
    return two(Math.floor(centi/6000)) + ':' + two(Math.floor(centi/100)%60) + '.' + two(centi%100);
  };

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function draw(at) {
    frame = Math.min(clip.to-1, Math.max(clip.from, at));
    cut.render(frame);
    seek.value = frame;
    byId('clock').textContent = clock(frame) + ' / ' + clock(clip.to);
    byId('back').disabled = frame === clip.from;
    byId('next').disabled = frame === clip.to-1;
    if (marks.firstChild) marks.replaceChildren();
    const moment = clip.moments.findLastIndex(([key]) => key <= frame);
    if (moment !== currentMoment) {
      if (currentMoment >= 0) moments.children[currentMoment]?.removeAttribute('aria-current');
      if (moment >= 0) moments.children[moment].setAttribute('aria-current', 'step');
      currentMoment = moment;
    }
  }

  function pause() {
    generation++;
    cancelAnimationFrame(animation);
    audio.pause();
    running = false;
    play.textContent = '播放';
  }

  function goto(at, annotations = []) {
    pause();
    draw(at);
    for (const [label, x, y, w, h] of annotations) {
      const mark = document.createElement('div');
      mark.className = 'mark';
      mark.style.left = (x / canvas.width * 100) + '%';
      mark.style.top = (y / canvas.height * 100) + '%';
      mark.style.width = (w / canvas.width * 100) + '%';
      mark.style.height = (h / canvas.height * 100) + '%';
      const text = document.createElement('span');
      text.textContent = label;
      mark.append(text);
      marks.append(mark);
    }
  }

  function select(id) {
    const next = clips.find(item => item.id === id);
    if (!next || next === clip) return;
    clip = next;
    [...list.children].forEach((button, index) => button.setAttribute('aria-current', String(clips[index] === clip)));
    byId('clip-title').textContent = clip.title;
    byId('watch').textContent = clip.watch;
    seek.min = clip.from;
    seek.max = clip.to-1;
    currentMoment = -2;
    moments.replaceChildren(...clip.moments.map(([at, label, detail, annotations]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'moment';
      button.dataset.frame = at;
      for (const [role, text] of [['time', clock(at)], ['title', label], ['detail', detail]]) {
        const element = document.createElement('span');
        element.className = 'moment-' + role;
        element.textContent = text;
        button.append(element);
      }
      button.onclick = () => goto(at, annotations);
      return button;
    }));
    goto(clip.from);
  }

  async function start() {
    if (running) { pause(); return; }
    if (frame === clip.to-1) draw(clip.from);
    const token = ++generation;
    errorBox.hidden = true;
    if (marks.firstChild) marks.replaceChildren();
    try {
      audio.currentTime = frame / fps;
      await audio.play();
    } catch {
      if (token === generation) showError('混音读取失败，请检查选段目录中的 mix.m4a。');
      return;
    }
    if (token !== generation) return;
    running = true;
    play.textContent = '暂停';
    function tick() {
      if (token !== generation) return;
      const at = Math.floor(audio.currentTime * fps + 1e-6);
      if (at >= clip.to || audio.ended) {
        pause();
        draw(clip.to-1);
        return;
      }
      if (Math.max(clip.from, at) !== frame) draw(at);
      animation = requestAnimationFrame(tick);
    }
    tick();
  }

  for (const item of clips) {
    const button = document.createElement('button');
    button.type = 'button';
    button.disabled = true;
    const time = document.createElement('small');
    time.textContent = clock(item.from) + '–' + clock(item.to);
    button.append(item.title, time);
    button.onclick = () => {
      select(item.id);
      location.hash = item.id;
    };
    list.append(button);
  }

  cut.ready.then(() => {
    select(location.hash.slice(1));
    if (!clip) select(clips[0].id);
    play.disabled = seek.disabled = false;
    for (const button of list.children) button.disabled = false;
    window.addEventListener('hashchange', () => select(location.hash.slice(1)));
  }).catch(() => showError('Canvas 素材读取失败，请检查选段目录中的 picture.js。'));

  play.onclick = start;
  byId('back').onclick = () => goto(frame-1);
  byId('next').onclick = () => goto(frame+1);
  byId('sound').onchange = event => { audio.muted = !event.target.checked; };
  seek.oninput = () => goto(Number(seek.value));
  audio.onended = () => {
    if (running) { pause(); draw(clip.to-1); }
  };
})();
</script>
</body>
</html>
