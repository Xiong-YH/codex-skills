<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>提问的艺术 · R38</title>
<style>
  :root{color-scheme:dark;--ground:#162320;--surface:#233630;--text:#f6e6c7;--soft:#bbc8b6;--edge:#4a6255;--green:#bad5b6;--gold:#e4bd88}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);font:15px/1.48 Inter,"Microsoft YaHei","PingFang SC",sans-serif}
  main{width:min(1150px,calc(100% - 34px));margin:auto;padding:20px 0 28px}
  h1,p,figure{margin:0}
  h1{font-size:clamp(25px,4vw,38px);line-height:1.13;font-weight:760}
  header,.row{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
  header{justify-content:space-between;padding-bottom:12px}
  .meta{color:var(--soft);font-size:13px;margin-top:4px}
  a{color:var(--green);text-underline-offset:4px}
  nav{margin-bottom:12px}
  canvas{width:100%;height:auto;aspect-ratio:16/9;display:block;background:#283e36;border:1px solid var(--edge);border-radius:9px 9px 0 0}
  figcaption{border:1px solid var(--edge);border-top:0;border-radius:0 0 9px 9px;background:var(--surface);padding:10px 12px}
  .seekrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:8px}
  output{color:var(--soft);font:13px "IBM Plex Mono",Consolas,monospace;white-space:nowrap}
  input[type=range]{min-width:0;width:100%;accent-color:var(--green)}
  button{font:inherit;font-size:13px;background:#2d473a;color:var(--text);border:1px solid #617d6a;border-radius:6px;padding:6px 10px;cursor:pointer}
  button.primary{background:var(--green);color:#152a21;font-weight:750;min-width:68px}
  button[aria-current=true]{border-color:var(--gold);color:var(--gold)}
  button:disabled{opacity:.55;cursor:default}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  label,#active-shot{font-size:13px;color:var(--soft)}
  #error{color:#ffe0a1;margin-top:8px}
  @media(max-width:540px){main{width:calc(100% - 16px);padding-top:12px}.row{column-gap:7px}.seekrow{gap:5px}figcaption{padding:7px}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>提问的艺术</h1><p class="meta" id="meta">R38 · 步进 V5 卡点版</p></div>
    <a href="../r37-reading-pass/index.html">对照 R37</a>
  </header>
  <nav class="row" aria-label="跳到段落" id="chapters"></nav>
  <figure aria-label="提问的艺术 R38">
    <canvas id="film" width="1280" height="720" aria-label="重剪版 Canvas 预览"></canvas>
    <figcaption>
      <div class="seekrow">
        <input type="range" id="seek" min="0" value="0" aria-label="视频进度" disabled>
        <output id="clock" for="seek">载入中</output>
      </div>
      <div class="row">
        <button type="button" class="primary" id="play" disabled>播放</button>
        <button type="button" id="restart" disabled>从头播放</button>
        <label><input type="checkbox" id="music" checked> 配乐与音效</label>
        <span id="active-shot"></span>
      </div>
      <p id="error" role="alert" hidden></p>
    </figcaption>
  </figure>
  <audio id="sound" preload="auto"></audio>

    const shift = Math.sin(t * .56) * 34;
    const light = g.createLinearGradient(80 + shift, 172, 580 + shift, 538);
    light.addColorStop(0, '#ffdc8f11');
    light.addColorStop(.5, '#ffdc8f20');

    for (let i = 0; i < 25; i++) {
      const x = 76 + (noise(i + 60) * 414 + t * (11 + i % 5)) % 446;
      const y = 141 + (noise(i + 156) * 331 + t * (3 + i % 3)) % 353;
      const life = .10 + .28 * (Math.sin(t * 1.9 + i * 1.25) * .5 + .5);

  function papers(g, frame, slots, start, last, zero) {
    if (!enabled) return;
    const offset = ease(zero, zero + 18, frame);
    const stackX = 99, stackY = 289;
    const trayY = 269 + offset * 15;
    const lanes = [0, .19, .36, .50, .62, .72, .81, .89, .96, 1];
    const colors = ['#e9d4a6', '#d9cba4', '#c5cdaa'];

    if (frame >= start - 15) {
      alpha(g, out((frame - start + 15) / 14), () => {
        box(g, 75, trayY, 171, 121, 12, '#453b33', '#9b825e', 4);

      const x = lerp(-72 + 13 * (i % 2), stackX + (i % 3) * 6, p);
      const y = lerp(308 + i % 2 * 18, stackY + (lanes.length - i - 1) * 5, p) - 38 * fling + offset * 15;

      g.translate(snap(x, 2), snap(y, 2));

      box(g, 2, 4, 124, 28, 5, '#322a256d');
      box(g, 0, 0, 124, 28, 5, colors[i % 3], '#9b835f', 2);
      rect(g, 9, 8, 43, 3, '#7f977e');
      rect(g, 9, 15, 73, 2, '#b09e7d');
      rect(g, 100, 8, 13, 11, '#f2e4b8');

      if (i % 2 === 0 || i === lanes.length - 1) sparks(g, 177, y + 18, frame - hit,

    const pulse = wave(frame - last, 17);
    alpha(g, pulse, () => {
      line(g, 242, trayY + 75, 268, trayY + 75, tan, 4);
      line(g, 268, trayY + 75, 268, 462, tan, 3);
      line(g, 268, 462, 318, 462, pale, 4);

    sparks(g, slots.x, slots.y, frame - zero, { direction: 94, range: 66, color: '#c7a696', life: 22, count: 24, paper: true });
  }

  function cut(g, x, y, p, draw) {
    if (p <= 0) return;
    if (p >= 1) {
      draw();
      return;
    }
    const bands = 12, step = H / bands;
    const rows = [];
    g.save();
    g.beginPath();
    for (let i = 0; i < bands; i++) {
      const delay = Math.min(.28, Math.abs((i + .5) * step - y) / H * .47);

    g.clip();
    draw();
    g.restore();
    alpha(g, .74 * (1 - p) ** .9, () => {
      for (const row of rows) {
        rect(g, row.left, row.y + 10, 5, 34, tan);
        rect(g, row.right - 5, row.y + 23, 5, 29, pale);
      }
    });
  }

    active: () => enabled,
    set: active => { enabled = Boolean(active); },
    out, wave, weighted, sparks, gleam, motionPacket, lightInRoom, papers, cut,
  });
})(window.AskingArt);

  function quantity(f) {
    const { start, full, maximum } = M.applications;
    const p = clamp((f - start) / (full - start));
    const knee = .86, head = .81, acceleration = 2.5;
    if (p < knee) return maximum * head * (p / knee) ** acceleration;
    const tail = head * acceleration * (1 - knee) / (knee * (1 - head));
    return maximum * (1 - (1 - head) * ((1 - p) / (1 - knee)) ** tail);
  }

      const left = x + i * (w + 9);
      box(g, left, y, w, h, 10, '#263b39', '#997f59', 3);
      g.save();
      g.beginPath();
      g.rect(left + 6, y + 6, w - 12, h - 12);
      g.clip();
      const face = { face: 'Consolas,monospace', align: 'center', color, weight: 850 };
      fillText(g, String(integer), left + w / 2, y + h / 2 - step, 91, face);
      if (step > 0) fillText(g, String((integer + 1) % 10), left + w / 2, y + h * 1.5 - step, 91, face);
      g.restore();
    }
  }

    const point = { x: 335 * 1.26 - 24 - 4, y: 596 + (356 - 596) * 1.26 - 109 };
    const scale = 1 - .034 * charge + .54 * thrust;
    g.save();
    g.translate(point.x, point.y);
    g.scale(scale, scale);
    g.translate(-point.x, -point.y);
    const head = firstChat(Math.min(frame, end('s03') - 1), false);
    const contract = 1 - .29 * charge;
    const fade = 1 - out(0, 19, f);
    alpha(fade, () => {
      questionShape(lerp(head.x, point.x, charge) - 103 * contract - 130 * thrust, head.y - 35 - 42 * thrust, 50, '#d8dfb0');
      questionShape(point.x, point.y, 85 + 22 * charge + 69 * thrust, '#ffe1a0');
      questionShape(lerp(head.x, point.x, charge) + 93 * contract + 126 * thrust, head.y - 40 - 52 * thrust, 56, '#d8dfb0');
    });
    g.restore();
    FX.cut(g, point.x, point.y, ease(-2, 30, f), () => P.autumnSetup(Math.max(0, f)));
    if (f >= 0 && f < 27) {
      for (const direction of [-158,-75,8,79,153]) {
        FX.sparks(g, point.x, point.y, f, { direction, range: 280, count: 15, life: 27, color: '#f5d5a0' });
      }
      const hit = FX.wave(f, 7);
      alpha(hit * .35, () => box(g, point.x - 62 - 35 * (1 - hit), point.y - 50, 125 + 70 * (1 - hit), 102,
        10, '#ffeece'));
    }
  }

  function pageReveal(p, draw) {
    if (p <= 0) return;
    if (p >= 1) { draw(); return; }
    const edge = lerp(W + 95, -98, p);
    g.save();
    g.beginPath();
    g.moveTo(edge - 43,0); g.lineTo(W,0); g.lineTo(W,H); g.lineTo(edge + 46,H);
    g.closePath(); g.clip();
    draw();
    g.restore();
    alpha(.77 * Math.sin(Math.PI * p), () => {
      R.polygon([[edge-60,0],[edge-43,0],[edge+46,H],[edge+26,H]], '#b99668');
      line(g, edge-44, 0, edge+45, H, '#f0d3a2', 3);
    });
  }

  function autumnToResume(frame) {
    const f = frame - when('autumn-outcome');
    const previous = Math.min(frame,end('autumn-setup')-1) - when('autumn-setup');
    const p = ease(-13, 27, f);
    const incoming = Math.max(0,f);
    P.autumnSetup(previous,false);
    pageReveal(p, () => P.autumnOutcome(incoming,false));
    const b = P.resume(incoming);
    const bounds = mixBox(P.autumnTask,{x:b.x*1.35-172,y:b.y*1.35-88,w:b.w*1.35,h:b.h*1.35},p);
    bounds.y -= 34 * Math.sin(p * Math.PI);
    P.autumnSlip(bounds,p);
  }

  function resumeToNow(frame) {
    const f = frame - when('s04');
    const previous = Math.min(frame,end('autumn-outcome')-1) - when('autumn-outcome');
    P.autumnOutcome(previous);
    pageReveal(ease(-10,34,f), () => now(f));
  }

  const nowMessages = [
    { cue: 'c02', frame: when('s04') + M.returnNow.reply, own: false },
    { cue: 'still-stuck', frame: when('s04') + M.returnNow.message, own: true },
  ];

  function questionPosition(f) {
    const frames = end('s04') - when('s04');
    const p = ease(M.returnNow.travel, frames, f);
    return { x: lerp(856, 640, p), y: lerp(539, 455, p) - Math.sin(Math.PI * p) * 48, p };
  }

  function options(f) {
    const { languages, gather, travel } = M.returnNow;
    const packed = ease(gather, travel + 7, f);
    const accents = ['#c9d5ad', '#e4c393', '#bfcdc5'];
    const picked = Math.floor((f - languages[2]) / 30) % 3;
    ['C', 'Python', 'Java'].forEach((label, index) => {
      const at = languages[index];
      const p = out(at - 13, at, f);
      const hover = (f >= languages[2] && index === picked && packed < .2);
      const w = 184 * (1 - .64 * packed);
      const center = lerp(650 + index * 205 + (index - 1) * (1 - p) * 64, 856, packed);
      const y = lerp(431 + (1 - p) * 66, 507, packed) - (hover ? 7 : 0);
      alpha(p * (1 - packed), () => {
        const x = center - w / 2;
        box(g, x + 4, y + 7, w, 63, 10, '#1c302db4');
        box(g, x, y, w, 63, 10, accents[index], hover ? '#f6d38c' : '#98a491', hover ? 4 : 3);
        for (let tick = 0; tick <= index; tick++) rect(g, x + 13 + tick * 8, y + 11, 4, 9, '#668271');
        fillText(g, label, center, y + 33, 33 - 9 * packed, { color: '#314c43', weight: 890, align: 'center', maxWidth: w - 14 });
      });
      FX.sparks(g, center + 64, y + 57, f - at, { direction: 27, range: 35, count: 13, life: 14, paper: true });
    });
  }

  function now(f, showQuestion = true) {
    const frame = when('s04') + f;
    const push = ease(M.returnNow.message - 12, M.returnNow.message + 12, f);
    roomShot(f >= M.returnNow.narration ? 'reread' : 'doubt', frame, { scale: 1 + .16 * push, shift: -12 * push });
    alpha(out(1,20,f) * (1 - ease(65,83,f)), () => tag(C['return-now'], { x: 64, y: 54, w: 158, h: 42 }, 'dusk'));
    const point = questionPosition(f);
    messages(frame, nowMessages, { open: out(34,43,f) });
    options(f);
    if (showQuestion) alpha(out(M.returnNow.question - 9, M.returnNow.question, f), () => {
      const small = 1 - point.p;
      alpha(small, () => box(g, point.x - 36, point.y - 27, 72, 54, 10, '#3e554b', '#7f9b85', 3));
      questionShape(point.x, point.y, 35 + 24 * point.p, '#f3d292');
      alpha(point.p, () => line(g, point.x - 42 * point.p, point.y + 28, point.x + 42 * point.p, point.y + 28, '#c79963', 4));
    });
  }

  function titleLink(f) {
    if (f >= 43) {
      P.title(f);
      return;
    }
    now(end('s04') - when('s04'), false);
    const p = ease(0, 42, f);
    FX.cut(g, 640, 454, p, () => P.title(f));
    alpha(1 - ease(16, 42, f), () => fillText(g, '？', 640, 455 - 32 * p, 59 - 15 * p,
      { align: 'center', weight: 870, color: '#f3d292' }));
  }

  function titleToChapter(frame) {
    const start = when('chapter-one');
    const local = Math.max(0, frame - start);
    const p = ease(start - 13, start + M.chapterLand, frame);
    P.title(frame - when('s05'), p, () => P.chapterOne(local, { entry: p, contained: true }));
  }

  function chapterToChat(frame) {
    const start = when('ask-directions');
    const f = frame - start;
    P.chapterOne(Math.min(frame,start-1) - when('chapter-one'),{omit:0});
    pageReveal(ease(-12,26,f), () => narrow(frame));
  }

  const chapterLinks = [
    ['chapter-one','ask-directions'], ['chapter-two','s06'], ['chapter-three','s07'], ['chapter-four','confirm-understanding'],
  ];
  const chapterContext = new Map([
    ['ask-directions',0],['s06',1],['s07',2],['practice-reply',2],
    ['confirm-understanding',3],['s11',3],['schedule-action',3],['record-progress',3],['follow-up-results',3],
    ['reflect-direction',3],['s13',3],
  ]);

  function chapterBadge(shot, frame) {
    const origin = chapterLinks.findIndex(([id, next], index) =>
      id === shot.id && frame >= when(next) - (index === 1 ? M.researchBadgeLead : 40));
    const active = origin >= 0 ? origin : chapterContext.get(shot.id);
    if (active === undefined) return;
    const f = frame - when(chapterLinks[active][1]);
    if (f >= M.badgeDock[active]) {
      P.badge(P.corner,active,true);
      return;
    }
    const home = P.badgeHome(active);
    const reprise = frame - when('chapter-three') - M.chapterThreeReprise;
    const chordHit = active === 2 ? FX.wave(reprise, 12) : 0;
    const grow = .27 * ease(-(active === 1 ? M.researchBadgeLead : 40),-16,f) + .066 * chordHit;
    const large = { x:home.x-home.w*grow/2, y:home.y-home.h*grow/2, w:home.w*(1+grow), h:home.h*(1+grow) };
    const p = ease(-15,M.badgeDock[active],f);
    const next = mixBox(large,P.corner,p);
    const rest = 1 - p;
    const arc = (a,b,c,d) => a*rest**3 + 3*b*rest**2*p + 3*c*rest*p**2 + d*p**3;
    next.x = arc(large.x,lerp(large.x,P.corner.x,.46),P.corner.x,P.corner.x);
    next.y = arc(large.y,large.y+43,330,P.corner.y);
    P.badge(next,active,true);
    if (active === 2) FX.gleam(g, next, reprise, '#ffe6a5', 16);
  }

  function directionCards(f) {
    return M.directionCards.map((event, i) => {
      const p = out(event - 24, event, f);
      const amount = FX.weighted(f - event, 23, 17);
      return { x: lerp(i ? 366 : 237, i ? 383 : 96, p), y: lerp(-107, 493, p) + amount,
        w: 174, h: 72, p, event };
    });
  }

  function drawDirectionCards(cards) {
    cards.forEach((bounds, i) => {
      if (bounds.p <= 0) return;
      P.tile(bounds, i ? '后端' : '前端', i ? 'server' : 'project', i ? 'gold' : 'green');
    });
  }

  function narrow(frame, cards = true) {
    const f = frame - when('ask-directions');
    const [firstDrop, lastDrop] = M.directionCards;
    const move = ease(firstDrop - 4, lastDrop + 14, f);
    const pose = f >= lastDrop + 13 ? 'reread' : f >= firstDrop - 21 ? 'surprise' : 'read';
    const device = roomShot(pose, frame, { scale: 1 + .19 * move, shift: -11 * move, tilt: -.05 * move + response(frame, directions) });
    messages(frame, directions, { open: out(0, 15, f), device });
    if (!cards) return;
    const dropped = directionCards(f);
    drawDirectionCards(dropped);
    dropped.forEach((bounds, i) => FX.sparks(g, bounds.x + bounds.w - 13, bounds.y + bounds.h - 6,
      f - bounds.event, { direction: 34, color: i ? '#e8c085' : '#b1cca8', range: 74, count: 21, paper: true }));
  }

  function directionLink(f, omit = -1) {
    const previous = end('ask-directions') - 1;
    const start = directionCards(previous - when('ask-directions'));
    const p = ease(0, 31, f);
    if (f < 32) {
      narrow(previous, false);
      FX.cut(g, 468, 520, p, () => P.chapterTwo(f, [], omit));
    } else P.chapterTwo(f, [], omit);
    const cards = start.map((entry, i) => {
      const target = { x: 418 + i * 239, y: 395, w: 194, h: 60 };
      return { ...mixBox(entry, target, p), p: 1 };
    });
    drawDirectionCards(cards);
  }

  function chapterToResearch(frame) {
    const next = when('s06');
    const f = frame - next;
    directionLink(Math.min(frame,next-1)-when('chapter-two'),1);
    pageReveal(ease(-10,14,f),() => P.research(Math.max(0,f)));
  }

  function thirdHeading(f, omit = -1) {
    const cue = C['chapter-follow-up'];
    alpha(out(M.chapterThreeTitle - 15, M.chapterThreeTitle, f), () => {
      box(g, 581, 123, 541, 99, 14, '#233b37dc', '#7a9c86', 3);
      fillText(g, cue, 851, 165, 37, { align: 'center', weight: 850, maxWidth: 514 });
      line(g, 644, 198, 1055, 198, '#ba9969', 3);
    });
    P.chapterRail(2,f,{omit});
  }

  function chapterThree(f, frame) {
    const pose = f >= 61 ? 'read' : f >= 33 ? 'reread' : 'surprise';
    const lift = ease(5, 25, f);
    const show = () => {
      roomShot(pose, frame, { scale: lerp(1.22, 1.04, ease(54, 89, f)), shift: -9, height: 329, tilt: -.047 * lift });
      thirdHeading(f);
    };
    const noteFrame = frame - when('s06');
    if (f < 34) {
      P.research(Math.min(noteFrame,byId.get('s06').frames - 1), false);
      FX.cut(g, 846, 286, ease(-13, 34, f), show);
    } else show();
    const note = P.carriedProject(noteFrame);
    tag('项目经历', note, 'gold', 25);
    FX.sparks(g, note.x+note.w*.86, note.y+33, f - 19, { direction: 14, range: 73, count: 21, paper: true });
  }

  function specificChat(frame, shot) {
    const q = frame - when('s07');
    const reply = specific[2].frame;
    const confirmation = specific[3].frame;
    const nodAt = when('practice-reply') + M.responseNod;
    const nod = ease(nodAt-6,nodAt+4,frame) * (1-ease(nodAt+4,nodAt+22,frame));
    const cheerAt = when('s11') + M.cheer;
    const pump = ease(cheerAt - 11,cheerAt,frame) * (1-ease(cheerAt+9,cheerAt+29,frame));
    const brace = ease(cheerAt-21,cheerAt-8,frame) * (1-ease(cheerAt-8,cheerAt+3,frame));
    const pose = frame >= end('s11') - 10 ? 'lower' : frame >= confirmation ? frame >= specific[4].frame + 13 ? 'smile' : 'reread'
      : frame >= reply ? frame >= nodAt + 20 ? 'smile' : frame >= reply + 21 ? 'reread' : 'surprise'
        : q < 32 || frame < specific[1].frame ? 'read' : 'doubt';
    const zoom = ease(reply + 5, reply + 25, frame);
    const joined = ease(0, 27, q);
    const device = roomShot(pose, frame, { height: lerp(329,309,joined) - 6 * nod - 8 * brace + 8 * pump,
      scale: lerp(1.04,1,joined) + .19 * zoom, shift: -9 - 4 * zoom,
      tilt: response(frame,specific) + .086 * nod - .032 * pump, cheer: pump });
    if (pump > 0) FX.sparks(g, 280, 435, frame - cheerAt, { direction: -105, count: 12, range: 54, color: '#e4cb97', life: 19 });
    if (q >= -40 && q < 19) alpha(1 - ease(-10,18,q), () => thirdHeading(frame - when('chapter-three'),2));
    const chapterStart = when('chapter-four'), chapterEnd = end('chapter-four');
    const compact = ease(chapterStart+4,chapterStart+24,frame) * (1-ease(chapterEnd-9,chapterEnd+23,frame));
    g.save();
    if (compact > 0) { g.translate(1211,105); g.scale(1-.17*compact,1-.17*compact); g.translate(-1211,-105); }
    messages(frame, specific, { open: out(5,22,q), device: compact < .03 ? device : null });
    g.restore();
    const attach = specific[0].frame - when('s07') - 4;
    if (q < attach) {
      const remaining = 1 - out(attach - 13, attach, q);
      const firstBounds = mixBox(P.photoTag, { x: 774, y: 217, w: 125, h: 30 }, ease(17, attach, q));
      const secondBounds = mixBox({ x: 1205, y: 314, w: 193, h: 42 }, { x: 862, y: 231, w: 127, h: 31 }, ease(9, attach, q));
      alpha(remaining, () => tag('项目经历', firstBounds, 'gold', 23));
      alpha(out(6, 13, q) * remaining, () => tag('课程作业', secondBounds, 'green', 23));
    }
    if (shot.id === 'chapter-four') {
      const f = frame - shot.start;
      const p = out(0,15,f) * (1-ease(shot.frames-25,shot.frames-8,f));
      narration(C['chapter-try'], { x: 851, y: 63, size: 35, width: 657, show: p });
      P.chapterRail(3,f,{omit:f >= shot.frames-40 ? 3 : -1});
    }
  }

  function actionLink(f, shot) {
    if (f >= 32) {
      P.plan(f);
      return;
    }
    const depart = { x: 543, y: 406, w: 475, h: 61 };
    const land = { x: 350, y: 303, w: 420, h: 52 };
    const p = ease(0, 31, f);
    specificChat(end('s11') - 1, byId.get('s11'));
    FX.cut(g, 681, 414, p, () => P.plan(f));
    alpha(1 - out(17, 25, f), () => tag(P.task, mixBox(depart, land, p), 'green', 27));
  }

  function turning(shot, previous, f) {
    const draw = paperSequences[shot.id];
    const old = paperSequences[previous?.id];
    if (f >= 25 || !old) {
      draw(f);
      return;
    }
    const progress = ease(0, 24, f);
    old(previous.frames - 1);
    const x = lerp(1038, 303, progress);
    g.save();
    g.beginPath();
    g.rect(x, 246, 1050 - x, 377);
    g.clip();
    draw(f);
    g.restore();
    const face = Math.sin(Math.PI * progress);
    alpha(face, () => {
      const fold = g.createLinearGradient(x - 32, 248, x + 26, 248);
      fold.addColorStop(0, '#7d604500');
      fold.addColorStop(.55, '#c7ab80');
      fold.addColorStop(1, '#faf0c500');
      rect(g, x - 32, 247, 58, 372, fold);
      rect(g, x + 3, 247, 2, 372, '#f8e6bc');
    });
  }

  function turnAcrossDesk(previous, next, f) {
    const frames = 18;
    if (f < frames) paperSequences[previous.id](previous.frames - 1);
    pageReveal(ease(0, frames, f), () => next(f));
  }

  function render(value) {
    const frame = Math.max(0, Math.min(D.frames - 1, Math.round(value)));
    const index = D.timeline.findIndex(shot => frame < shot.start + shot.frames);
    const shot = D.timeline[index];
    const f = frame - shot.start;
    g.save();
    try {
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalAlpha = 1;
      switch (shot.id) {
        case 's01': P.opening(f); break;
        case 's02':
          if (frame >= end('s02')-15) firstChatHandoff(frame);
          else context(f,frame);
          break;
        case 's03':
          if (f < 23) firstChatHandoff(frame);
          else if (frame >= end('s03') - 15) imaginedCut(frame, frame - end('s03'));
          else firstChat(frame);
          break;
        case 'autumn-setup':
          if (frame >= end('autumn-setup')-13) autumnToResume(frame);
          else imaginedCut(frame,f);
          break;
        case 'autumn-outcome':
          if (f < 27) autumnToResume(frame);
          else if (frame >= end('autumn-outcome')-10) resumeToNow(frame);
          else P.autumnOutcome(f);
          break;
        case 's04':
          if (f < 34) resumeToNow(frame);
          else now(f);
          break;
        case 's05':
          if (frame >= end('s05') - 13) titleToChapter(frame);
          else titleLink(f);
          break;
        case 'chapter-one':
          if (f < M.chapterLand) titleToChapter(frame);
          else if (frame >= end('chapter-one') - 40) chapterToChat(frame);
          else P.chapterOne(f);
          break;
        case 'ask-directions':
          if (f < 26) chapterToChat(frame);
          else narrow(frame);
          break;
        case 'chapter-two':
          if (frame >= end('chapter-two') - M.researchBadgeLead) chapterToResearch(frame);
          else directionLink(f);
          break;
        case 's06':
          if (f < 14) chapterToResearch(frame);
          else if (frame >= end('s06') - 13) chapterThree(frame - end('s06'), frame);
          else P.research(f);
          break;
        case 'chapter-three':
          if (frame >= end('chapter-three') - 40) specificChat(frame,shot);
          else chapterThree(f,frame);
          break;
        case 's07':
        case 'practice-reply':
        case 'chapter-four':
        case 'confirm-understanding':
        case 's11': specificChat(frame, shot); break;
        case 'schedule-action': actionLink(f, shot); break;
        case 'reflect-direction': turnAcrossDesk(D.timeline[index - 1], P.reflect, f); break;
        case 's13': turnAcrossDesk(D.timeline[index - 1], P.finish, f); break;
        case 's16': turnAcrossDesk(D.timeline[index - 1], P.summary, f); break;
        case 'comment-invite': turnAcrossDesk(D.timeline[index - 1], P.invite, f); break;
        default: turning(shot, D.timeline[index - 1], f);
      }
      chapterBadge(shot,frame);
      screenCaption(shot,frame);
    } finally { g.restore(); }
    return frame;
  }
  window.AskingRecut = Object.freeze({ ready, render });
})(window.ASKING_RECUT, window.AskingR36Art, window.AskingR36Paper);
</script>
<script>(function (D, cut) {
  'use strict';

  const byId = id => document.getElementById(id);
  const sound = byId('sound');
  const play = byId('play');
  const seek = byId('seek');
  const total = D.frames / D.fps;
  const buttons = [];
  let shown = -1;
  let playing = false;
  let request;
  let generation = 0;
  let resumeAfterSeek = false;

  function timeText(seconds) {
    const ticks = Math.round(seconds * 100);
    return String(Math.floor(ticks / 6000)).padStart(2, '0') + ':' + ((ticks % 6000) / 100).toFixed(2).padStart(5, '0');
  }

  function paint(frame) {
    const at = Math.max(0, Math.min(D.frames - 1, Math.round(frame)));
    if (shown !== at) {
      shown = at;
      cut.render(at);
    }
    seek.value = shown;
    byId('clock').value = timeText(shown / D.fps) + ' / ' + timeText(total);
    const shot = D.timeline.find(item => shown < item.start + item.frames);
    byId('active-shot').textContent = shot.label;
    for (const { button, id } of buttons) button.setAttribute('aria-current', String(id === shot.id));
  }

  function fail(message, error) {
    byId('error').textContent = message;
    byId('error').hidden = false;
    console.error(error);
  }

  function stop() {
    generation++;
    playing = false;
    sound.pause();
    cancelAnimationFrame(request);
    play.textContent = '播放';
  }

  async function start(frame) {
    stop();
    const token = generation;
    const at = frame >= D.frames - 1 ? 0 : frame;
    paint(at);
    byId('error').hidden = true;
    try {
      sound.currentTime = at / D.fps;
      sound.muted = !byId('music').checked;
      await sound.play();
      if (token !== generation) return;
      playing = true;
      play.textContent = '暂停';
      const tick = () => {
        if (token !== generation || !playing) return;
        if (sound.ended || sound.currentTime >= total) {
          paint(D.frames - 1);
          stop();
          return;
        }
        paint(Math.floor(sound.currentTime * D.fps));
        request = requestAnimationFrame(tick);
      };
      request = requestAnimationFrame(tick);
    } catch (error) {
      if (token === generation) fail('音轨读取失败，请检查本页旁的配乐文件。', error);
    }
  }

  function move(frame) {
    const wasPlaying = playing;
    stop();
    paint(frame);
    if (wasPlaying) void start(frame);
  }

  sound.src = D.bgm;
  seek.max = D.frames - 1;
  byId('meta').textContent += ' · ' + timeText(total).slice(0, -3) + ' · 无口播';
  for (const [id, label] of D.chapters) {
    const { start } = D.timeline.find(shot => shot.id === id);
    const button = document.createElement('button');
    button.type = 'button';
    const stamp = timeText(start / D.fps).replace(/[.]00$|(?<=[.]\d)0$/u, '');
    button.textContent = stamp + ' ' + label;
    button.disabled = true;
    button.onclick = () => move(start);
    byId('chapters').append(button);
    buttons.push({ button, id });
  }
  play.onclick = () => playing ? stop() : void start(shown);
  byId('restart').onclick = () => { void start(0); };
  byId('music').onchange = () => { sound.muted = !byId('music').checked; };
  seek.oninput = () => {
    const frame = Number(seek.value);
    resumeAfterSeek ||= playing;
    stop();
    paint(frame);
  };
  seek.onchange = () => {
    if (resumeAfterSeek) void start(shown);
    resumeAfterSeek = false;
  };
  cut.ready.then(() => {
    paint(0);
    for (const control of [seek, play, byId('restart'), ...buttons.map(item => item.button)]) control.disabled = false;
    document.body.dataset.ready = 'true';
  }).catch(error => fail('画面素材读取失败。', error));
})(window.ASKING_RECUT, window.AskingRecut);
</script>
</body>
</html>
